---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-api-remote
  namespace: kube-system
  labels:
    app: intelliaide-api
    purpose: cross-cluster-job-management

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rca-ephemeral-ns-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rca-api-remote-binding
subjects:
  - kind: ServiceAccount
    name: rca-api-remote
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: rca-ephemeral-ns-manager
  apiGroup: rbac.authorization.k8s.io
