---
apiVersion: v1
kind: Secret
metadata:
  name: jobs-cluster-kubeconfig
  namespace: must-gather
  labels:
    app: must-gather-api
    purpose: cross-cluster-auth
type: Opaque
data:
  # Base64-encoded kubeconfig for the rca-api-remote ServiceAccount
  # on the jobs cluster.
  #
  # Generate with:
  #   oc --context=jobs-cluster sa create-kubeconfig rca-api-remote -n kube-system | base64 -w0
  kubeconfig: <BASE64_ENCODED_KUBECONFIG>
