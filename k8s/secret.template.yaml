apiVersion: v1
kind: Secret
metadata:
  name: gcloud-adc-secret
  namespace: must-gather
type: Opaque
stringData:
  # Template only — do NOT commit real credentials. Do NOT oc apply this file.
  #
  # Recommended (Vertex / service account in config.json):
  #   ./k8s/sync-secrets-from-config.sh Version_V1/Config/config.json
  #
  # Or use the full deploy script (build + secrets + apply):
  #   ./k8s/deploy-openshift.sh
  #
  # Legacy ADC login:
  #   gcloud auth application-default login
  #   oc create secret generic gcloud-adc-secret \
  #     --namespace=must-gather \
  #     --from-file=application_default_credentials.json=$HOME/.config/gcloud/application_default_credentials.json
  application_default_credentials.json: '{}'
