[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelliaide"
version = "3.0.0"
authors = [
    {name = "IntelliAide Team", email = "intelliaide@example.com"},
]
description = "A comprehensive must-gather analysis system for OpenShift diagnostics"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators", 
    "Intended Audience :: Developers",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
keywords = ["openshift", "kubernetes", "diagnostics", "must-gather", "rca", "analysis"]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.0",
    "google-auth>=2.20.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "drain3>=0.9.11",
    "odfpy>=1.4.1",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "kubernetes>=28.1.0",
    "fpdf2>=2.7.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "pre-commit>=2.0.0",
]

[project.scripts]
intelliaide-api = "api.api:main"
intelliaide-worker = "api.worker:main"
intelliaide-chat = "api.chat_ui:main"
intelliaide-hydra = "api.hydra_client:main"

[project.urls]
Homepage = "https://github.com/your-org/intelliaide"
Repository = "https://github.com/your-org/intelliaide.git"
Issues = "https://github.com/your-org/intelliaide/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*"]

[tool.setuptools.package-data]
"api" = ["config/*.json", "config/*.yaml", "data_source/*.md", "data_source/*.odt"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["api"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    ".eggs",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=api",
    "--cov-report=html",
    "--cov-report=term-missing",
]